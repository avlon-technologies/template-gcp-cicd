name: CI/CD — Release → STG

on:
  push:
    branches:
      - release/**
      - milestone/**
  # No inputs: the build label is a pure function of the commit (branch name
  # + commit height), so there is nothing for the operator to choose — a
  # dispatch means "deploy this branch's HEAD to stg".
  workflow_dispatch:

# Dispatches deploy to stg — serialize them with the other stg pipelines
# (hotfix/support share the group). Pushes only build, so they queue per
# branch instead of blocking each other across branches.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-stg' || format('build-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      # When an existing image is reused, its stamped label (from the promote
      # step) wins over the freshly derived one — the binary is the source of
      # truth for what it reports.
      version: ${{ steps.promote.outputs.version || steps.version.outputs.value }}
      promote-ref: ${{ steps.promote.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the label embeds the commit height
          # (git rev-list --count), which a shallow clone would report as 1.
          # Treeless partial clone keeps this cheap as history grows — the
          # count needs commit objects only, no trees or blobs.
          fetch-depth: 0
          filter: tree:0

      - name: Derive version from the commit
        id: version
        # The label is deterministic — branch name + commit height — so every
        # build of the same commit produces the same label, and the push
        # build's artifact is reusable when the deploy is dispatched later.
        env:
          REF: ${{ github.ref_name }}
        run: |
          # The dispatch form's branch selector defaults to the repo's default
          # branch (develop) — reject anything that isn't actually a release
          # or milestone branch before touching version logic, so a mis-set
          # selector fails fast instead of building/deploying the wrong ref.
          if [[ "$REF" == release/* ]]; then
            BRANCH_KIND=release
            BRANCH_VERSION="${REF#release/}"
          elif [[ "$REF" == milestone/* ]]; then
            BRANCH_KIND=milestone
            BRANCH_VERSION="${REF#milestone/}"
          else
            echo "::error::This workflow must be run from a release/* or milestone/* branch, not '$REF'. Check the 'Use workflow from' branch selector on the dispatch form — it defaults to the repository's default branch."
            exit 1
          fi

          HEIGHT=$(git rev-list --count HEAD)
          if [ "$BRANCH_KIND" = release ]; then
            VALUE="$BRANCH_VERSION-build.$HEIGHT"
          else
            VALUE="ms-$BRANCH_VERSION.$HEIGHT"
          fi
          # Labels become image tags and git tags — restrict to a safe
          # charset. The auto-generated label inherits the branch name, which
          # can carry characters those reject.
          if [[ ! "$VALUE" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Label '$VALUE' contains unsupported characters (allowed: letters, digits, '.', '-'). Rename the branch."
            exit 1
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@140bb5113ffb6b65a7e9b937a81fa96cf5064462 # v2.1.11
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.BUILD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Locate existing rc image
        id: promote
        # Reuse the image the push build already produced for this commit
        # rather than rebuilding: labels are commit-derived, so the push build
        # was stamped with the same label this dispatch resolved. The image is
        # found by its sha-<commit> tag; the label it was stamped with is
        # recovered from its other tag. If that disagrees with the freshly
        # derived label (the derivation changed between push and dispatch),
        # the existing stamp wins — the version is compiled into the binary,
        # and re-labeling would ship an app that reports the wrong version.
        #
        # Unlike the GitHub Artifacts lookup this replaces, there is no
        # retention window: an Artifact Registry image does not expire, so
        # the "artifact expired, must rebuild" path simply does not exist.
        if: github.event_name == 'workflow_dispatch'
        env:
          DERIVED: ${{ steps.version.outputs.value }}
          AR_LOCATION: ${{ vars.AR_LOCATION }}
          AR_PROJECT_ID: ${{ vars.AR_PROJECT_ID }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          set -euo pipefail
          IMAGE="${AR_LOCATION}-docker.pkg.dev/${AR_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}"

          INFO="$(gcloud artifacts docker images list "$IMAGE" \
            --include-tags \
            --filter="tags:sha-${GITHUB_SHA}" \
            --format=json 2>/dev/null || echo '[]')"

          DIGEST="$(echo "$INFO" | jq -r '.[0].version // empty')"
          if [ -z "$DIGEST" ]; then
            echo "No existing image tagged sha-$GITHUB_SHA — will build."
            exit 0
          fi

          # Tags on that image: sha-<commit> plus the build label it carries.
          # tags is an array in current gcloud, a comma-joined string in older
          # ones — handle both rather than depending on the SDK version the
          # runner happens to ship.
          EXISTING_LABEL="$(echo "$INFO" | jq -r '
            .[0].tags
            | if type == "array" then .[] else split(",")[] end
          ' | grep -v '^sha-' | head -1 || true)"
          if [ -z "$EXISTING_LABEL" ]; then
            echo "Image for $GITHUB_SHA carries no label tag — rebuilding."
            exit 0
          fi

          if [ "$EXISTING_LABEL" != "$DERIVED" ]; then
            echo "::warning::Existing image is stamped '$EXISTING_LABEL' (derived '$DERIVED' — label derivation changed since the push build). Deploying the binary as what it actually reports."
            echo "⚠️ **Label drift:** existing image is stamped \`$EXISTING_LABEL\` but the current derivation yields \`$DERIVED\`. Deploying under the stamped label — push a new commit to adopt the new derivation." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Reusing existing image ${IMAGE}@${DIGEST} (label '$EXISTING_LABEL') — build will be skipped."
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "version=$EXISTING_LABEL" >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.promote-ref == ''
    needs: prepare
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      # Every build on a release/milestone branch is promotable: labels are
      # commit-derived, so the push build already carries the label a later
      # dispatch will resolve. The image is tagged sha-<commit> for exactly
      # that lookup.
      push-image: true

  deploy:
    # Only deploy when the release coordinator manually dispatches — not on every push.
    # !failure() && !cancelled() instead of implicit success(): success() is false when
    # ANY ancestor job was skipped, and on the promotion path the build job is skipped.
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [prepare, build]
    # Callers must grant what the reusable workflow's job requests — the repo
    # default token is read-only and called workflows cannot elevate it.
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: stg
      build-label: ${{ needs.prepare.outputs.promote-ref != '' && needs.prepare.outputs.version || needs.build.outputs.build-label }}
      image-ref: ${{ needs.prepare.outputs.promote-ref != '' && needs.prepare.outputs.promote-ref || needs.build.outputs.image-ref }}
      # stg tags are the prod promotion gate's proof of a green staging
      # deploy and the QA/UAT audit trail.
      tag-deployment: true
